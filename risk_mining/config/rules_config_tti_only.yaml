# Risk Mining Pipeline Configuration - TTI only experiment

data:
  desired_data: ["sind-tj"]
  data_dirs:
    sind: "./datasets/SinD_dataset"
  desired_dt: 0.1
  centric: scene
  cache_location: "./.unified_data_cache"
  rebuild_cache: false
  rebuild_maps: false
  num_workers: 0
  verbose: false

rules:
  spatial:
    in_roi:
      enabled: true
      roi_radius: 20.0
      context_roi_radius: 12.0
  dynamic:
    ttc:
      enabled: true
      ttc_threshold: 2.5
      causal_filter:
        enabled: true
        lane_constrained_types: ["VEHICLE", "MOTORCYCLE"]
        current_lane_max_dist: 2.5
        lane_query_radius_m: 8.0
        lane_heading_threshold_deg: 35.0
        low_confidence_threshold: 0.4
        intersection_proximity_radius_m: 18.0
        lane_reachable_hops: 3
        lane_conflict_distance_m: 3.5
        lane_conflict_heading_diff_deg: 30.0
        manual_review_on_low_confidence: true
        track_birth_manual_review_window_sec: 2.0

slicer:
  pre_buffer_sec: 2.0
  post_buffer_sec: 2.0
  ego_motion_threshold: 0.5
  ttc_event_threshold: 2.5
  pet_event_threshold: 2.0
  tti_event_threshold: 2.5
  ttc_clear_threshold: 5.0
  min_peak_gap_sec: 4.0
  max_episodes_per_scene: 50
  reaction_latency_sec: 1.8
  stable_duration_sec: 1.0
  dynamic_acc_threshold: 3.0
  dynamic_jerk_threshold: 4.0
  lateral_speed_threshold: 0.5
  launch_acc_threshold: 2.0
  forward_roi_distance: 50.0
  conflict_zone_radius: 6.0
  visibility_fov_deg: 140.0
  occlusion_lateral_threshold: 2.5
  pet_prediction_horizon_sec: 5.0
  tti_prediction_horizon_sec: 4.0
  tti_conflict_radius: 3.0
  tti_initial_roi_distance: 40.0
  tti_min_intersection_angle_deg: 25.0
  tti_prefilter_enabled: true
  tti_prefilter_ratio: 0.75
  following_filter_enabled: true
  following_heading_threshold_deg: 20.0
  following_lateral_threshold_m: 4.0
  causal_max_distance_m_for_pet_ttc: 25.0
  stop_speed_threshold: 0.1
  zero_acc_threshold: 0.3
  enable_pet_peak: false
  enable_tti_peak: true
  enable_ttc_peak: false
  enable_dynamics_peak: false

output:
  output_dir: "./risk_mining/output/tti_only_experiment"
